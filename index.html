<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronLog Workout Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        /* Custom scrollbar for inner containers */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased select-none flex items-center justify-center min-h-screen p-0 sm:p-4" x-data="workoutApp()">

    <!-- 9:16 ASPECT RATIO MOBILE SHELL CONTAINER -->
    <div class="w-full sm:max-w-[400px] sm:h-[844px] h-screen bg-gray-950 sm:border-[8px] sm:border-gray-800 sm:rounded-[40px] flex flex-col relative overflow-hidden shadow-2xl">

        <!-- TOP HEADER -->
        <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-2">
                <div :class="{'bg-blue-600': theme==='blue', 'bg-emerald-600': theme==='emerald', 'bg-purple-600': theme==='purple', 'bg-amber-600': theme==='amber'}" class="text-white p-2 rounded-xl font-bold flex items-center justify-center w-9 h-9 transition-colors">
                    <i class="fa-solid fa-dumbbell text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">IronLog</h1>
                    <p class="text-xs text-gray-400">Streak: <span class="text-orange-400 font-semibold" x-text="streak"></span> Days 🔥</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button @click="openSettingsModal = true" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- SCROLLABLE CONTENT VIEWPORT -->
        <main class="flex-1 overflow-y-auto p-4 pb-24">

            <!-- TAB 1: WORKOUT SPLITS & ACTIVE WORKOUT -->
            <template x-if="activeTab === 'splits'">
                <div>
                    <!-- VIEW A: SPLIT LIST -->
                    <template x-if="!currentWorkoutSplit && !activeLogViewDate">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-bold">Your Splits</h2>
                                <button @click="openCreateModal()" :class="btnThemeClass" class="text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow-lg flex items-center gap-1.5 transition">
                                    <i class="fa-solid fa-plus text-xs"></i> New Split
                                </button>
                            </div>

                            <div class="space-y-3">
                                <template x-for="split in splits" :key="split.id">
                                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-sm">
                                        <div class="flex justify-between items-start mb-2">
                                            <div>
                                                <span class="text-xs uppercase tracking-wider font-semibold px-2 py-0.5 rounded" :class="badgeThemeClass" x-text="split.presetName"></span>
                                                <h3 class="text-lg font-bold mt-1" x-text="split.name"></h3>
                                            </div>
                                            <div class="flex gap-1">
                                                <button @click="editSplit(split)" class="text-gray-500 hover:text-gray-200 p-1.5"><i class="fa-solid fa-pen text-xs"></i></button>
                                                <button @click="deleteSplit(split.id)" class="text-gray-500 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash text-xs"></i></button>
                                            </div>
                                        </div>
                                        
                                        <div class="text-sm text-gray-400 mb-4">
                                            <p><span class="font-medium text-gray-200" x-text="split.exercises.length"></span> Exercises configured</p>
                                        </div>

                                        <button @click="startWorkout(split)" :class="btnThemeClass" class="w-full text-white font-medium py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                                            <i class="fa-solid fa-play text-xs"></i> Start Workout
                                        </button>
                                    </div>
                                </template>

                                <template x-if="splits.length === 0">
                                    <div class="text-center py-12 text-gray-500">
                                        <i class="fa-solid fa-clipboard-list text-4xl mb-3"></i>
                                        <p>No splits created yet. Create one to begin!</p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- VIEW B: ACTIVE WORKOUT SESSION -->
                    <template x-if="currentWorkoutSplit">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <button @click="currentWorkoutSplit = null" class="text-gray-400 hover:text-white text-sm flex items-center gap-1">
                                    <i class="fa-solid fa-arrow-left"></i> Cancel
                                </button>
                                <h2 class="font-bold text-sm text-center" :class="textThemeClass" x-text="currentWorkoutSplit.name"></h2>
                                <div class="w-12"></div>
                            </div>

                            <div class="space-y-4 mb-6">
                                <template x-for="(exercise, index) in currentWorkoutSplit.exercises" :key="index">
                                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4">
                                        <div class="flex justify-between items-center mb-3">
                                            <h4 class="font-bold text-base text-gray-100" x-text="exercise.name"></h4>
                                            <span class="text-xs text-gray-500">3 Sets</span>
                                        </div>

                                        <div class="space-y-2">
                                            <template x-for="setNum in [1, 2, 3]" :key="setNum">
                                                <div class="flex items-center gap-2 bg-gray-950 p-2 rounded-xl border border-gray-800/60">
                                                    <span class="text-xs font-bold text-gray-400 w-12" x-text="'Set ' + setNum"></span>
                                                    <div class="flex-1 flex items-center gap-1">
                                                        <input type="number" placeholder="Wt" x-model.number="exercise['set' + setNum].weight" class="w-full bg-gray-900 text-center rounded-lg py-1.5 text-sm border border-gray-800 focus:outline-none">
                                                        <span class="text-xs text-gray-500">lbs</span>
                                                    </div>
                                                    <div class="flex-1 flex items-center gap-1">
                                                        <input type="number" placeholder="Reps" x-model.number="exercise['set' + setNum].reps" class="w-full bg-gray-900 text-center rounded-lg py-1.5 text-sm border border-gray-800 focus:outline-none">
                                                        <span class="text-xs text-gray-500">reps</span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <button @click="finishWorkout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i> Finish & Log Workout
                            </button>
                        </div>
                    </template>

                    <!-- VIEW C: VIEW PAST LOGGED WORKOUT -->
                    <template x-if="activeLogViewDate">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <button @click="activeLogViewDate = null" class="text-gray-400 hover:text-white text-sm flex items-center gap-1">
                                    <i class="fa-solid fa-arrow-left"></i> Back
                                </button>
                                <h2 class="font-bold text-xs" :class="textThemeClass" x-text="activeLogViewDate"></h2>
                                <div class="w-12"></div>
                            </div>

                            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-4">
                                <h3 class="text-xl font-bold mb-1" x-text="activeLogData.splitName"></h3>
                                <p class="text-xs text-gray-400 mb-4">Preset: <span class="text-gray-200" x-text="activeLogData.presetName"></span></p>

                                <div class="space-y-4">
                                    <template x-for="exercise in activeLogData.exercises" :key="exercise.name">
                                        <div class="bg-gray-950 p-3 rounded-xl border border-gray-800/80">
                                            <h4 class="font-semibold text-sm text-gray-200 mb-2" x-text="exercise.name"></h4>
                                            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                                                <template x-for="s in [1, 2, 3]">
                                                    <div class="bg-gray-900 p-1.5 rounded-lg border border-gray-800">
                                                        <p class="text-gray-500" x-text="'Set ' + s"></p>
                                                        <p class="font-medium text-gray-200 mt-0.5"><span x-text="exercise['set'+s].weight || 0"></span> lbs</p>
                                                        <p class="text-gray-400"><span x-text="exercise['set'+s].reps || 0"></span> reps</p>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- TAB 2: CALENDAR & HISTORY -->
            <template x-if="activeTab === 'calendar'">
                <div>
                    <h2 class="text-xl font-bold mb-4">Workout History</h2>

                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-4">
                        <div class="flex justify-between items-center mb-4">
                            <button @click="changeMonth(-1)" class="p-2 text-gray-400 hover:text-white"><i class="fa-solid fa-chevron-left"></i></button>
                            <h3 class="font-bold text-base" x-text="monthNames[currentMonth] + ' ' + currentYear"></h3>
                            <button @click="changeMonth(1)" class="p-2 text-gray-400 hover:text-white"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>

                        <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-gray-500 mb-2">
                            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                        </div>

                        <div class="grid grid-cols-7 gap-1 text-center">
                            <template x-for="day in calendarDays">
                                <div>
                                    <template x-if="day.dateStr">
                                        <button @click="viewLogForDate(day.dateStr)" 
                                            :class="{
                                                [calendarHighlightClass]: day.hasWorkout,
                                                'bg-gray-950 text-gray-300 hover:bg-gray-800': !day.hasWorkout
                                            }"
                                            class="w-full aspect-square rounded-xl text-sm flex flex-col items-center justify-center relative transition">
                                            <span x-text="day.dayNum"></span>
                                            <span x-show="day.hasWorkout" class="absolute bottom-1 w-1 h-1 bg-white rounded-full"></span>
                                        </button>
                                    </template>
                                    <template x-if="!day.dateStr">
                                        <div class="w-full aspect-square"></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                    <template x-if="selectedCalendarDateLog">
                        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4">
                            <h4 class="text-xs uppercase font-semibold mb-1" :class="textThemeClass" x-text="selectedCalendarDateStr"></h4>
                            <h3 class="text-lg font-bold mb-3" x-text="selectedCalendarDateLog.splitName"></h3>
                            <button @click="jumpToLogView(selectedCalendarDateStr)" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-medium py-2 rounded-xl transition">
                                View Full Exercise Breakdown
                            </button>
                        </div>
                    </template>
                    <template x-if="!selectedCalendarDateLog && selectedCalendarDateStr">
                        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center text-gray-500 text-sm">
                            No workout recorded on <span x-text="selectedCalendarDateStr"></span>.
                        </div>
                    </template>
                </div>
            </template>

        </main>

        <!-- BOTTOM MOBILE NAVIGATION BAR -->
        <nav class="absolute bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 flex justify-around py-3 z-40">
            <button @click="activeTab = 'splits'; activeLogViewDate = null; currentWorkoutSplit = null;" :class="activeTab === 'splits' ? textThemeClass : 'text-gray-500'" class="flex flex-col items-center flex-1 transition">
                <i class="fa-solid fa-dumbbell text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Splits</span>
            </button>
            <button @click="activeTab = 'calendar'; activeLogViewDate = null; currentWorkoutSplit = null;" :class="activeTab === 'calendar' ? textThemeClass : 'text-gray-500'" class="flex flex-col items-center flex-1 transition">
                <i class="fa-solid fa-calendar-days text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">History</span>
            </button>
        </nav>

        <!-- MODAL: CREATE / EDIT SPLIT -->
        <div x-show="openCreateSplitModal" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
            <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto">
                <h3 class="text-lg font-bold mb-4" x-text="editingSplitId ? 'Edit Workout Split' : 'Create Workout Split'"></h3>

                <div class="space-y-4 mb-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Preset Category Name</label>
                        <input type="text" x-model="newSplitPreset" placeholder="e.g., Push / Pull / Legs" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Split Day Name</label>
                        <input type="text" x-model="newSplitName" placeholder="e.g., Push Day A" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-semibold text-gray-400">Exercises</label>
                            <button @click="newSplitExercises.push({ name: '', set1: {weight:'', reps:''}, set2: {weight:'', reps:''}, set3: {weight:'', reps:''} })" class="text-xs font-medium" :class="textThemeClass">+ Add Exercise</button>
                        </div>

                        <div class="space-y-2">
                            <template x-for="(ex, idx) in newSplitExercises" :key="idx">
                                <div class="flex gap-2 items-center">
                                    <input type="text" x-model="ex.name" :placeholder="'Exercise ' + (idx + 1)" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none">
                                    <button @click="newSplitExercises.splice(idx, 1)" class="text-gray-500 hover:text-red-400 px-2"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button @click="openCreateSplitModal = false" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2.5 rounded-xl text-sm transition">Cancel</button>
                    <button @click="saveSplit()" :class="btnThemeClass" class="w-1/2 text-white font-medium py-2.5 rounded-xl text-sm transition">Save Split</button>
                </div>
            </div>
        </div>

        <!-- MODAL: SETTINGS & CUSTOMIZATION -->
        <div x-show="openSettingsModal" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" style="display: none;">
            <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                <h3 class="text-lg font-bold mb-4">App Settings</h3>

                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">Accent Theme</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button @click="setTheme('blue')" :class="theme === 'blue' ? 'border-white' : 'border-transparent'" class="bg-blue-600 h-10 rounded-xl border-2 transition"></button>
                            <button @click="setTheme('emerald')" :class="theme === 'emerald' ? 'border-white' : 'border-transparent'" class="bg-emerald-600 h-10 rounded-xl border-2 transition"></button>
                            <button @click="setTheme('purple')" :class="theme === 'purple' ? 'border-white' : 'border-transparent'" class="bg-purple-600 h-10 rounded-xl border-2 transition"></button>
                            <button @click="setTheme('amber')" :class="theme === 'amber' ? 'border-white' : 'border-transparent'" class="bg-amber-600 h-10 rounded-xl border-2 transition"></button>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-800">
                        <button @click="resetAllData()" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 text-sm font-medium py-2.5 rounded-xl transition">
                            Reset All Data
                        </button>
                    </div>
                </div>

                <button @click="openSettingsModal = false" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-medium py-2.5 rounded-xl text-sm transition">Close</button>
            </div>
        </div>

    </div>

    <!-- APP SCRIPT -->
    <script>
        function workoutApp() {
            return {
                activeTab: 'splits',
                splits: [],
                workoutLogs: {},
                streak: 0,
                theme: 'blue',
                
                // Modals & States
                openCreateSplitModal: false,
                openSettingsModal: false,
                editingSplitId: null,
                newSplitPreset: '',
                newSplitName: '',
                newSplitExercises: [{ name: '', set1:{weight:'',reps:''}, set2:{weight:'',reps:''}, set3:{weight:'',reps:''} }],
                
                currentWorkoutSplit: null,
                activeLogViewDate: null,
                activeLogData: null,

                currentMonth: new Date().getMonth(),
                currentYear: new Date().getFullYear(),
                monthNames: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
                selectedCalendarDateStr: null,
                selectedCalendarDateLog: null,

                init() {
                    if (localStorage.getItem('ironlog_theme')) {
                        this.theme = localStorage.getItem('ironlog_theme');
                    }
                    const savedSplits = localStorage.getItem('ironlog_splits');
                    if (savedSplits) {
                        this.splits = JSON.parse(savedSplits);
                    } else {
                        this.splits = [
                            {
                                id: 1,
                                presetName: 'Push / Pull / Legs',
                                name: 'Push Day',
                                exercises: [
                                    { name: 'Bench Press', set1:{weight:'',reps:''}, set2:{weight:'',reps:''}, set3:{weight:'',reps:''} },
                                    { name: 'Overhead Press', set1:{weight:'',reps:''}, set2:{weight:'',reps:''}, set3:{weight:'',reps:''} }
                                ]
                            }
                        ];
                        this.saveSplits();
                    }

                    const savedLogs = localStorage.getItem('ironlog_logs');
                    if (savedLogs) this.workoutLogs = JSON.parse(savedLogs);

                    this.calculateStreak();
                },

                setTheme(t) {
                    this.theme = t;
                    localStorage.setItem('ironlog_theme', t);
                },

                get btnThemeClass() {
                    return {
                        'bg-blue-600 hover:bg-blue-500 shadow-blue-600/30': this.theme === 'blue',
                        'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/30': this.theme === 'emerald',
                        'bg-purple-600 hover:bg-purple-500 shadow-purple-600/30': this.theme === 'purple',
                        'bg-amber-600 hover:bg-amber-500 shadow-amber-600/30': this.theme === 'amber'
                    };
                },

                get textThemeClass() {
                    return {
                        'text-blue-400': this.theme === 'blue',
                        'text-emerald-400': this.theme === 'emerald',
                        'text-purple-400': this.theme === 'purple',
                        'text-amber-400': this.theme === 'amber'
                    };
                },

                get badgeThemeClass() {
                    return {
                        'text-blue-400 bg-blue-950': this.theme === 'blue',
                        'text-emerald-400 bg-emerald-950': this.theme === 'emerald',
                        'text-purple-400 bg-purple-950': this.theme === 'purple',
                        'text-amber-400 bg-amber-950': this.theme === 'amber'
                    };
                },

                get calendarHighlightClass() {
                    return {
                        'bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30': this.theme === 'blue',
                        'bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/30': this.theme === 'emerald',
                        'bg-purple-600 text-white font-bold shadow-md shadow-purple-600/30': this.theme === 'purple',
                        'bg-amber-600 text-white font-bold shadow-md shadow-amber-600/30': this.theme === 'amber'
                    };
                },

                saveSplits() {
                    localStorage.setItem('ironlog_splits', JSON.stringify(this.splits));
                },

                openCreateModal() {
                    this.editingSplitId = null;
                    this.newSplitName = '';
                    this.newSplitPreset = '';
                    this.newSplitExercises = [{ name: '', set1:{weight:'',reps:''}, set2:{weight:'',reps:''}, set3:{weight:'',reps:''} }];
                    this.openCreateSplitModal = true;
                },

                editSplit(split) {
                    this.editingSplitId = split.id;
                    this.newSplitName = split.name;
                    this.newSplitPreset = split.presetName;
                    this.newSplitExercises = JSON.parse(JSON.stringify(split.exercises));
                    this.openCreateSplitModal = true;
                },

                saveSplit() {
                    if (!this.newSplitName || this.newSplitExercises.length === 0) {
                        alert('Please fill out the split name and add at least one exercise.');
                        return;
                    }

                    const cleanExercises = this.newSplitExercises.filter(e => e.name.trim() !== '').map(e => ({
                        name: e.name,
                        set1: e.set1 || { weight: '', reps: '' },
                        set2: e.set2 || { weight: '', reps: '' },
                        set3: e.set3 || { weight: '', reps: '' }
                    }));

                    if (this.editingSplitId) {
                        const index = this.splits.findIndex(s => s.id === this.editingSplitId);
                        if (index !== -1) {
                            this.splits[index] = {
                                id: this.editingSplitId,
                                presetName: this.newSplitPreset || 'General Preset',
                                name: this.newSplitName,
                                exercises: cleanExercises
                            };
                        }
                    } else {
                        const newSplit = {
                            id: Date.now(),
                            presetName: this.newSplitPreset || 'General Preset',
                            name: this.newSplitName,
                            exercises: cleanExercises
                        };
                        this.splits.push(newSplit);
                    }

                    this.saveSplits();
                    this.openCreateSplitModal = false;
                },

                deleteSplit(id) {
                    if (confirm('Are you sure you want to delete this split?')) {
                        this.splits = this.splits.filter(s => s.id !== id);
                        this.saveSplits();
                    }
                },

                startWorkout(split) {
                    this.currentWorkoutSplit = JSON.parse(JSON.stringify(split));
                },

                finishWorkout() {
                    const todayStr = new Date().toISOString().split('T')[0];
                    this.workoutLogs[todayStr] = {
                        splitName: this.currentWorkoutSplit.name,
                        presetName: this.currentWorkoutSplit.presetName,
                        exercises: this.currentWorkoutSplit.exercises
                    };
                    localStorage.setItem('ironlog_logs', JSON.stringify(this.workoutLogs));
                    this.calculateStreak();
                    this.currentWorkoutSplit = null;
                    alert('Workout logged successfully!');
                },

                get calendarDays() {
                    const firstDayIndex = new Date(this.currentYear, this.currentMonth, 1).getDay();
                    const totalDays = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                    let days = [];
                    for (let i = 0; i < firstDayIndex; i++) {
                        days.push({ dayNum: '', dateStr: null, hasWorkout: false });
                    }
                    for (let d = 1; d <= totalDays; d++) {
                        const formattedMonth = String(this.currentMonth + 1).padStart(2, '0');
                        const formattedDay = String(d).padStart(2, '0');
                        const dateStr = `${this.currentYear}-${formattedMonth}-${formattedDay}`;
                        days.push({
                            dayNum: d,
                            dateStr: dateStr,
                            hasWorkout: !!this.workoutLogs[dateStr]
                        });
                    }
                    return days;
                },

                changeMonth(direction) {
                    this.currentMonth += direction;
                    if (this.currentMonth > 11) { this.currentMonth = 0; this.currentYear++; }
                    else if (this.currentMonth < 0) { this.currentMonth = 11; this.currentYear--; }
                },

                viewLogForDate(dateStr) {
                    this.selectedCalendarDateStr = dateStr;
                    this.selectedCalendarDateLog = this.workoutLogs[dateStr] || null;
                },

                jumpToLogView(dateStr) {
                    this.activeLogData = this.workoutLogs[dateStr];
                    this.activeLogViewDate = dateStr;
                    this.activeTab = 'splits';
                },

                calculateStreak() {
                    let currentStreak = 0;
                    let checkDate = new Date();
                    const formatDate = (d) => {
                        let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
                        if (month.length < 2) month = '0' + month;
                        if (day.length < 2) day = '0' + day;
                        return [year, month, day].join('-');
                    };
                    let todayStr = formatDate(checkDate);
                    if (!this.workoutLogs[todayStr]) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        todayStr = formatDate(checkDate);
                        if (!this.workoutLogs[todayStr]) { this.streak = 0; return; }
                    }
                    while (true) {
                        let dateStr = formatDate(checkDate);
                        if (this.workoutLogs[dateStr]) {
                            currentStreak++;
                            checkDate.setDate(checkDate.getDate() - 1);
                        } else { break; }
                    }
                    this.streak = currentStreak;
                },

                resetAllData() {
                    if (confirm('Are you sure? This erases all data permanently.')) {
                        localStorage.clear();
                        location.reload();
                    }
                }
            }
        }
    </script>
</body>
</html>
